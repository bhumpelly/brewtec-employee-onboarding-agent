# BrewTec monitoring: Prometheus collects n8n metrics, Grafana shows them.
# Start in this folder:  docker compose up -d
# Grafana:     http://localhost:3001  (port 3000 is used by Flowise)
# Prometheus:  http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: brewtec-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: brewtec-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"

volumes:
  prometheus_data:
  grafana_data:
